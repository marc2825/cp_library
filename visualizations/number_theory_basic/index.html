<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数論：基本整数演算 — 3.13</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="style.css"><script defer src="model.js"></script><script defer src="app.js"></script></head>
<body><main class="shell"><nav class="topnav"><a href="../index.html">← 解説一覧</a><a id="doc-link" href="../../docs/number_theory_basic/README.md">API と使用例</a></nav><p class="eyebrow">3.13 / INTEGER ARITHMETIC</p><h1>割り切れる理由を、追いかける。</h1><p class="intro">余りを小さくする、冪を二乗する、倍数を消す。入力を変え、一歩ずつ進めながら整数演算の仕組みと条件を確かめます。</p>
<div class="tabs" aria-label="アルゴリズム"><button data-mode="gcd" aria-pressed="true">GCD・LCM</button><button data-mode="extended" aria-pressed="false">拡張Euclid</button><button data-mode="pow" aria-pressed="false">mod累乗</button><button data-mode="inverse" aria-pressed="false">mod逆元</button><button data-mode="sieve" aria-pressed="false">素数篩</button><button data-mode="spf" aria-pressed="false">SPF</button><button data-mode="factor" aria-pressed="false">素因数分解</button><button data-mode="divisors" aria-pressed="false">約数列挙</button></div>
<div class="workspace"><section class="card controls" aria-label="入力"><p class="section-label">01 / 入力と条件</p>
<label class="field" id="a-field">整数 a<input id="a" type="text" inputmode="numeric" spellcheck="false"></label><label class="field" id="b-field">整数 b<input id="b" type="text" inputmode="numeric" spellcheck="false"></label><label class="field" id="exponent-field" hidden>指数（0以上）<input id="exponent" type="text" inputmode="numeric" spellcheck="false"></label><label class="field" id="modulus-field" hidden>法 m（1以上）<input id="modulus" type="text" inputmode="numeric" spellcheck="false"></label><label class="field" id="limit-field" hidden>上限 N（0〜80、上限を含む）<input id="limit" type="number" min="0" max="80"></label><label class="field" id="query-field" hidden>分解する数（0で分解なし）<input id="query" type="number" min="0" max="80"></label><label class="field" id="n-field" hidden>正整数 n（1〜10,000）<input id="n" type="number" min="1" max="10000"></label>
<button id="run" class="primary wide">入力を反映して実行</button><p id="input-error" class="error" role="alert"></p><p id="input-note" class="hint"></p><div class="divider"></div><label class="field">例を選ぶ<select id="scenario-type"><option value="basic">基本の入力</option><option value="zero">0・1・空の篩</option><option value="negative">負の整数</option><option value="non-coprime">互いに素でない</option><option value="boundary">整数の境界・平方</option><option value="prime">素数・Fibonacci</option></select></label><button id="scenario" class="wide">例を読み込む</button></section>

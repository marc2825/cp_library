name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ai_generated

jobs:
  local:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y g++ libboost-dev
      - run: make verify-development
      - run: make verify-generation
      - run: make verify-feature-catalog
      - run: make verify-development-runtime
      - run: make verify-development-records
      - run: make verify-provenance
      - run: node verify/visualizations/linear_algebra_extensions_model_test.js
      - run: node verify/visualizations/string_extensions_model_test.js
      - run: node verify/visualizations/geometry_extensions_model_test.js
      - run: node verify/visualizations/search_parsing_extensions_model_test.js
      - run: node verify/visualizations/optimization_extensions_model_test.js
      - run: node verify/visualizations/numerical_analysis_model_test.js
      - run: node verify/visualizations/polynomial_extensions_model_test.js
      - run: node verify/visualizations/development_model_test.js
      - run: node verify/visualizations/development_runtime_model_test.js
      - run: node verify/visualizations/utility_search_model_test.js
      - run: node verify/visualizations/static_query_model_test.js
      - run: node verify/visualizations/data_structure_extensions_model_test.js
      - run: node verify/visualizations/data_structure_advanced_model_test.js
      - run: node verify/visualizations/tree_extensions_model_test.js
      - run: node verify/visualizations/graph_extensions_model_test.js
      - run: node verify/visualizations/graph_advanced_model_test.js
      - run: node verify/visualizations/dp_extensions_model_test.js
      - run: node verify/visualizations/combinatorics_extensions_model_test.js
      - run: node verify/visualizations/number_theory_extensions_model_test.js
      - run: python3 verify/run_graph_tree.py
      # Under the libstdc++ debug profile its structures test takes minutes instead of 0.3 s, so it runs here.
      - run: python3 verify/run_advanced.py
  # The stdlib-debug runner suite is split across machines; shards are balanced by
  # measured CI time and list the longest runners first. Each shard also runs its
  # runners concurrently (--jobs 0) because every runner is single-threaded.
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            runners: geometry_extensions linear_algebra_extensions optimization_extensions graph_extensions tree_extensions range_query union_find
          - shard: 2
            runners: number_theory_extensions graph_advanced data_structure_extensions search_parsing_extensions combinatorics_extensions static_query
          - shard: 3
            runners: polynomial_extensions data_structure_advanced dp_extensions utility_search string_extensions numerical_analysis
          # issue #3: runners reviewed per category (basic_utility, ...)
          - shard: 4
            runners: b_1_6 a_priority foundation_tools foundation basic_utility big_integer foundation_structures
          - shard: 5
            runners: b_7_11 graph_a graph_basic offline_query ordered_structure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y g++ libboost-dev
      - run: python3 -m tools.cp_tools.suite --stdlib-debug --jobs 0 --runners ${{ matrix.runners }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-${{ matrix.shard }}
          path: |
            ai_generated/build/suites
            ai_generated/verification/evidence
          if-no-files-found: warn
  report:
    needs: suite
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: suite-*
          merge-multiple: true
          path: ai_generated
      - run: make verification-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-verification-catalog
          path: |
            ai_generated/build/catalog
            ai_generated/build/suites
            ai_generated/verification/evidence
          if-no-files-found: warn
  online:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai_generated/.competitive-verifier/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y g++ libboost-dev
      - run: python3 -m pip install -r .competitive-verifier/requirements.txt
      - run: python3 tools/verify_ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-and-docs
          path: ai_generated/build/verifier
          if-no-files-found: warn

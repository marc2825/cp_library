<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>数値計算の収束を追う | cp_library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <nav><a href="../index.html">← 図解一覧</a><a href="../../docs/numerical_analysis/README.md">API・検証</a></nav>
    <p class="eyebrow">Y / NUMERICAL ANALYSIS</p>
    <h1>近似の過程と、止まる理由を見る。</h1>
    <p class="intro">求根・積分・補償和・実根分離・三重対角消去の11モード。入力や許容誤差を変えて、途中の状態を確かめられます。</p>
    <div class="layout">
      <section class="controls" aria-label="入力">
        <label for="mode">アルゴリズム</label><select id="mode"></select>
        <h2 id="title"></h2>
        <p class="hint">係数は定数項から昇べき順です。lower/upperは区間、toleranceは許容誤差です。サンプルを編集して実行してください。</p>
        <label for="input">入力 JSON</label><textarea id="input" spellcheck="false" rows="11"></textarea>
        <div class="buttons"><button id="run">実行</button><button id="sample" class="secondary">サンプルに戻す</button></div>
        <p id="input-error" role="alert"></p>
        <a id="doc-link" href="../../docs/numerical_analysis/README.md">このAPIの説明 →</a>
        <p class="hint">図解は小規模入力用の説明モデルです。Numberとlong doubleの精度や入力上限の違いは<a href="README.md">対応範囲</a></p>
      </section>
      <section class="viewer" aria-label="演算の内部状態">
        <div class="step-meta"><span id="step-count"></span><span>TRACE</span></div>
        <progress id="progress" value="0" max="1" aria-label="手順の進行"></progress>
        <h2 id="step-title"></h2><p id="detail"></p>
        <div id="forest" class="diagram" aria-label="関数・区間・行列の変化"></div>
        <div id="diagram" class="diagram"></div>
        <div id="values" aria-live="polite"></div>
        <div class="buttons navigation"><button id="first" class="secondary">先頭</button><button id="previous" class="secondary">戻る</button><button id="play">再生</button><button id="next">次へ</button><button id="finish" class="secondary">最後</button></div>
        <h3>計算結果</h3><pre id="result"></pre>
      </section>
    </div>
  </main>
  <script src="../computational_geometry/model.js"></script><script src="modes.js"></script><script src="model.js"></script><script src="app.js"></script>
</body>
</html>

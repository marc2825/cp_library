<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3.1〜3.6 B項目 | cp_library</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    textarea {width:100%;min-height:280px;resize:vertical;font:12px/1.6 ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--ink);}
    .controls select {width:100%;font-size:13px;margin-bottom:14px;}
    .buttons {display:flex;flex-wrap:wrap;gap:8px;padding:16px;border-bottom:1px solid var(--line);}
    .explanation {padding:20px;border-bottom:1px solid var(--line);min-height:130px;overflow-wrap:anywhere;}
    .table-wrap {overflow:auto;max-height:560px;padding:16px;}
    table {border-collapse:collapse;font-size:12px;width:100%;white-space:nowrap;}
    th,td {padding:8px 12px;border:1px solid var(--line);text-align:left;}
    th {background:var(--soft);position:sticky;top:0;}
    .drawing {min-height:60px;}
    #diagram {max-height:480px;min-height:160px;}
    #input-error {color:#9d382c;white-space:pre-wrap;font-size:12px;}
    #result {overflow-wrap:anywhere;font:13px/1.7 ui-monospace,monospace;max-height:180px;overflow:auto;}
    .step-count {margin-left:auto;font-size:12px;align-self:center;}
    .below-links {padding:20px 0;display:flex;flex-wrap:wrap;gap:16px;}
    @media(max-width:800px){.workspace{grid-template-columns:1fr;}textarea{min-height:160px;} .shell{padding:20px 14px;} }
  </style>
</head>
<body><main class="shell">
  <nav class="topnav"><a href="../index.html">← 全ての図解</a><a href="../../docs/b_1_6/README.md">実装・仕様・検証一覧</a></nav>
  <p class="eyebrow">SEARCH · DSU · RANGE · ORDERED · SPATIAL · 3.1–3.6 B</p><h1 id="title">3.1〜3.6 B項目</h1>
  <p class="intro" id="intro"></p>
  <div class="workspace" style="margin-top:24px">
    <aside class="controls card">
      <label class="field">アルゴリズム<select id="mode"></select></label>
      <label class="field">入力（JSON）<textarea id="input" spellcheck="false"></textarea></label>
      <p class="hint">小さい入力で検索・木・区間・二次元構造を追います。64bit整数は10進文字列でも指定できます。モデルの範囲は下の説明を参照してください。</p>
      <div class="actions"><button id="run" class="primary">入力を反映</button><button id="sample">サンプルへ戻す</button></div>
      <p id="input-error" role="alert"></p>
      <div class="divider"></div><p class="section-label">最終結果</p><div id="result"></div>
    </aside>
    <section class="card">
      <div class="buttons"><button id="first">最初</button><button id="previous">戻る</button><button id="next">次へ</button><button id="play">再生</button><button id="finish">最後</button><span id="step-count" class="step-count"></span></div>
      <div class="explanation"><h2 id="step-title"></h2><p id="step-note"></p></div>
      <div class="drawing"><svg id="diagram" viewBox="0 0 760 160" role="img" aria-label="現在の状態遷移または配列"></svg></div>
      <div class="table-wrap"><table><thead id="columns"></thead><tbody id="rows"></tbody></table></div>
    </section>
  </div>
  <nav class="below-links"><a id="documentation" href="../../docs/b_1_6/README.md">個別のAPI・使用例</a><a href="README.md">図の範囲と簡略化</a><a href="../../docs/b_1_6/references.md">参考資料</a></nav>
</main><script src="specs.js"></script><script src="model.js"></script><script src="app.js"></script></body></html>

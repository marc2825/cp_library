<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>組合せ論・数え上げ — 3.15</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="style.css"><script defer src="model.js"></script><script defer src="app.js"></script></head>
<body><main class="shell"><nav class="topnav"><a href="../index.html">← 解説一覧</a><a id="doc-link" href="../../docs/combinatorics/README.md">API と使用例</a></nav><p class="eyebrow">3.15 / COMBINATORICS</p><h1>同じものを、何回数えた？</h1><p class="intro">順序を区別するか、重複を許すか。階乗と二項係数から始め、括弧列・星と仕切り・集合の重なりへ進みます。法と前計算の条件も変えて確かめられます。</p>
<div class="tabs" aria-label="アルゴリズム"><button data-mode="factorial" aria-pressed="true">階乗・逆階乗</button><button data-mode="binomial" aria-pressed="false">二項係数</button><button data-mode="permutation" aria-pressed="false">順列</button><button data-mode="combination" aria-pressed="false">組合せ</button><button data-mode="catalan" aria-pressed="false">Catalan数</button><button data-mode="multiset" aria-pressed="false">重複組合せ</button><button data-mode="inclusion" aria-pressed="false">包除原理</button></div>
<div class="workspace"><section class="card controls" aria-label="入力"><p class="section-label">01 / 入力と条件</p><div id="table-fields"><label class="field" id="backend-field">計算法<select id="backend"><option value="factorial">階乗・逆階乗（高速）</option><option value="pascal">Pascalの三角形（任意法）</option></select></label><label class="field">前計算の上限（0〜24）<input id="bound" type="number" min="0" max="24"></label><div class="fields"><label class="field"><span id="n-label">n</span><input id="n" type="number" min="-1" max="12"></label><label class="field" id="k-field">k<input id="k" type="number" min="-1" max="12"></label></div></div>
<div id="inclusion-fields" hidden><label class="field">求める範囲<select id="target"><option value="union">少なくとも1つに属する</option><option value="complement">どれにも属さない</option></select></label><label class="field">全体集合の要素数（0〜12）<input id="universe" type="number" min="0" max="12"></label><label class="field">集合（1行1集合、空集合は -）<textarea id="sets" rows="5" spellcheck="false"></textarea></label><p class="hint">全体集合は0から要素数−1。集合は6個までです。</p></div>
<label class="field"><span id="modulus-label">法（1以上）</span><input id="modulus" type="text" inputmode="numeric"></label><button id="run" class="primary wide">入力を反映して実行</button><p id="input-error" class="error" role="alert"></p><p class="hint" id="input-note"></p><div class="divider"></div><label class="field">例を選ぶ<select id="scenario-type"><option value="basic">基本の入力</option><option value="empty">0個・0種類・空</option><option value="composite">合成数の法</option><option value="nonunit">逆元を作れない上限</option><option value="mod-one">法1</option><option value="large-mod">64ビットの大きい法</option><option value="zero-types">0種類から正の個数</option><option value="overlap">全て重なる集合</option><option value="out-of-range">前計算が足りない例</option></select></label><button id="scenario" class="wide">例を読み込む</button></section>
<section class="card" aria-label="実行の状態"><div class="stats"><div class="stat"><small>結果（mod適用後）</small><strong id="result">未確定</strong></div><div class="stat"><small>段階</small><strong id="phase-value"></strong></div><div class="stat"><small id="size-label">前計算上限</small><strong id="size"></strong></div></div><div class="drawing"><svg id="diagram" role="img" aria-label="数え上げの仕組み" viewBox="0 0 780 400"></svg></div><div class="legend"><span><i class="dot active"></i>今回読む・数える値</span><span><i class="dot"></i>確定した値・更新先</span></div><p id="extra"></p><div class="playback"><button id="previous">← 戻る</button><button id="next">次へ →</button><button id="play">再生</button><button id="milestone">次の段階</button><button id="finish">最後へ</button><span id="progress" class="progress" aria-live="polite"></span></div><div class="explanation"><h2 id="step-title"></h2><p id="description"></p></div></section></div>
<div class="below"><section class="card notes"><h2>数え方と条件</h2><div class="formula" id="formula"></div><p id="principle"></p><p id="conditions"></p></section><section class="card notes"><h2 id="values-title">前計算の表</h2><div class="table-scroll bounded"><table><thead id="columns"></thead><tbody id="values"></tbody></table></div></section></div><section class="card notes details"><h2 id="details-title">計算に使った項</h2><div class="table-scroll bounded"><table><thead id="detail-columns"></thead><tbody id="detail-values"></tbody></table></div><p id="samples"></p></section><p class="footer">図解は小さい入力をBigIntで計算します。C++の全機械語命令や標準整数の超過例外は再現しません。<a href="../../docs/combinatorics/references.md">参考資料と設計判断</a></p></main></body></html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>幾何の境界と分割を追う | cp_library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <nav><a href="../index.html">← 図解一覧</a><a href="../../docs/geometry_extensions/README.md">API・検証</a></nav>
    <p class="eyebrow">H / GEOMETRY & ARRANGEMENTS</p>
    <h1>点を動かして、境界を確かめる。</h1>
    <p class="intro">面積・接線・面列挙・凸包・三角形分割を22モードで追います。入力を編集し、交点や領域の変化を確かめられます。</p>
    <div class="layout">
      <section class="controls" aria-label="入力">
        <label for="mode">アルゴリズム</label><select id="mode"></select>
        <h2 id="title"></h2>
        <p class="hint">点は[x,y]、円は[x,y,r]、矩形は[x1,y1,x2,y2]です。座標は数値または"1/2"のような分数文字列で、絶対値32以下を指定します。</p>
        <label for="input">入力 JSON</label><textarea id="input" spellcheck="false" rows="11"></textarea>
        <div class="buttons"><button id="run">実行</button><button id="sample" class="secondary">サンプルに戻す</button></div>
        <p id="input-error" role="alert"></p>
        <a id="doc-link" href="../../docs/geometry_extensions/README.md">このAPIの説明 →</a>
        <p class="hint">図解は小規模入力用の説明モデルです。C++の厳密有理演算・sweep・KD-treeなどとの違いは<a href="README.md">対応範囲</a></p>
      </section>
      <section class="viewer" aria-label="演算の内部状態">
        <div class="step-meta"><span id="step-count"></span><span>TRACE</span></div>
        <progress id="progress" value="0" max="1" aria-label="手順の進行"></progress>
        <h2 id="step-title"></h2><p id="detail"></p>
        <div id="forest" class="diagram" aria-label="点・辺・領域の変化"></div>
        <div id="diagram" class="diagram"></div>
        <div id="values" aria-live="polite"></div>
        <div class="buttons navigation"><button id="first" class="secondary">先頭</button><button id="previous" class="secondary">戻る</button><button id="play">再生</button><button id="next">次へ</button><button id="finish" class="secondary">最後</button></div>
        <h3>計算結果</h3><pre id="result"></pre>
      </section>
    </div>
  </main>
  <script src="modes.js"></script><script src="model.js"></script><script src="app.js"></script>
</body>
</html>
